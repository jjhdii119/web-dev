<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - Afdhal Jihadi</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #111827;
            --text-dark: #111827;
            --text-gray: #6b7280;
            --bg-main: #ffffff;
            --border: #e5e7eb;
            --radius: 8px;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-dark);
            margin: 0; padding: 0; line-height: 1.6;
        }
        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }
        nav {
            background-color: var(--bg-main);
            border-bottom: 1px solid var(--border);
            padding: 15px 0; position: sticky; top: 0; z-index: 100;
        }
        .nav-container { display: flex; justify-content: space-between; align-items: center; }
        .nav-profile { display: flex; align-items: center; gap: 15px; }
        .avatar-initial {
            width: 42px; height: 42px; background-color: var(--bg-main);
            color: var(--text-dark); border: 2px solid var(--text-dark);
            font-weight: 800; font-size: 1.1rem; display: flex;
            align-items: center; justify-content: center; border-radius: 50%;
        }
        .nav-profile-info h3 { margin: 0; font-size: 0.95rem; }
        .nav-profile-info p { margin: 0; font-size: 0.8rem; color: var(--text-gray); }
        .nav-links { display: flex; align-items: center; gap: 25px; }
        .nav-links a { text-decoration: none; color: var(--text-gray); font-weight: 600; font-size: 0.95rem; }
        .nav-links a:hover { color: var(--text-dark); }
        .hero { padding: 80px 0 50px 0; border-bottom: 1px solid var(--border); margin-bottom: 40px; }
        .tagline {
            display: inline-block; border: 1px solid var(--text-dark);
            padding: 6px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; margin-bottom: 25px;
        }
